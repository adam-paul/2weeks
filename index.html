<!DOCTYPE html>
<html>
<head>
  <title>WebSocket Architecture Study</title>
</head>
<body>
  <h1>WebSocket Architecture Study</h1>

  <div>
    <div id="status">You are disconnected from the server.</div>
    <button id="connectButton">Connect</button>
  </div>

  <div>
    <input type="text" id="messageInput" placeholder="Send a message to the server" />
    <button id="sendButton" disabled>Send</button>
  </div>

  <h3>Messages:</h3>
  <div id="messageStream"></div>

  <script type="module" src="/client.js"></script>
</body>
</html>
